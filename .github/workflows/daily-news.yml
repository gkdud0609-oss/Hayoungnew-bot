name: 데일리 뉴스 클리핑

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 월~금 08:00 UTC = 한국시간 오후 5시 정기 발송
    - cron: "0 5 * * 0"     # 일요일 05:00 UTC = 한국시간 오후 2시 (금 17시 ~ 일 14시 기사)
    - cron: "*/5 * * * *"   # 텔레그램 지켜보기 (한 번에 25분, 끝나면 대기 중인 다음 실행이 바로 이어받음)
  workflow_dispatch:         # Actions 탭에서 'Run workflow' 버튼으로 바로 실행
    inputs:
      mode:
        description: "daily = 정기 발송 / command = '뉴스' 답장 / poll = 텔레그램 지켜보기 시작"
        default: daily
        type: choice
        options: [daily, command, poll]

permissions:
  contents: write   # 마지막 뉴스 목록(last_news.json)을 저장하기 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # 텔레그램 지켜보기는 한 번에 하나만 (중복 답장 방지)
      group: news-${{ (github.event.schedule == '*/5 * * * *' || inputs.mode == 'poll') && 'poll' || 'daily' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Claude Code 미리 설치 (요약 속도 향상)
        if: ${{ github.event.schedule == '*/5 * * * *' || inputs.mode == 'poll' }}
        run: npm install -g @anthropic-ai/claude-code > /dev/null 2>&1 || true

      - name: 뉴스 수집 및 텔레그램 발송
        run: python3 news_bot.py
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '*/5 * * * *' && 'poll' || 'daily') }}
          # ★ 실제 값은 GitHub Secrets에 넣어요 (이 파일은 수정할 필요 없음)
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # Claude 구독 토큰 (AI 요약)

      - name: 봇 데이터 저장 (뉴스 목록·정리본·피드백)
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- last_news.json last_report.json style_feedback.txt)" ]; then
            git config user.name "news-bot"
            git config user.email "news-bot@users.noreply.github.com"
            git add -A -- last_news.json last_report.json style_feedback.txt
            git commit -m "봇 데이터 저장"
            git pull --rebase -X theirs -q || true
            git push
          fi
